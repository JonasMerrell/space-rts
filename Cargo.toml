[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
macroquad = { version = "0.4.14", default-features = false, features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
